name: Check and release

# Every push checks the addon (Lua syntax, TOC). A new version in BlatoJournal.toc is released as
# v<version> with the zip, but only when the check passed. (Adapted from One More Quest's workflow.)
on:
  push:
    branches: [main]
    paths:
      - "BlatoJournal/**"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Lua syntax of every file
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            luac5.1 -p "$f" || bad=1
          done < <(find BlatoJournal -name '*.lua' -print0)
          exit $bad

      - name: TOC
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "BlatoJournal"
          toc = open(os.path.join(root, "BlatoJournal.toc"), encoding="utf-8").read()
          listed = [l.strip().replace("\\", "/") for l in toc.splitlines() if l.strip() and not l.startswith("#")]
          files = sorted(os.path.relpath(os.path.join(r, f), root).replace(os.sep, "/")
                         for r, _, fs in os.walk(root) for f in fs if f.endswith(".lua"))
          bad = [f"TOC lists a missing file: {f}" for f in listed if f not in files]
          bad += [f"file not in the TOC: {f}" for f in files if f not in listed]
          version = re.search(r"^## Version:\s*(\S+)", toc, re.M)
          if not version:
              bad.append("the TOC has no version")
          for b in bad: print("::error::" + b)
          print(f"{len(listed)} files listed, version {version and version.group(1)}")
          sys.exit(1 if bad else 0)
          PY

  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(sed -n 's/^## Version: *//p' BlatoJournal/BlatoJournal.toc | tr -d '\r')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER exists, nothing to do"; exit 0
          fi
          zip -qr "BlatoJournal_v$VER.zip" BlatoJournal
          gh release create "v$VER" "BlatoJournal_v$VER.zip" \
            --title "Bláto Journal v$VER" \
            --notes "Unzip into the Interface/AddOns folder of your WoW Forever installation, then /reload in the game."
